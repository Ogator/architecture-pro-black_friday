name: mongo-sharding

services:
  # --- Config server (replSet: config_server) ---
  configSrv:
    container_name: configSrv
    image: dh-mirror.gitverse.ru/mongo:latest
    command:
      - --configsvr
      - --replSet
      - config_server
      - --bind_ip_all
      - --port
      - "27017"
    healthcheck:
      test: [ "CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      # ВАЖНО: mongod --configsvr использует dbpath /data/configdb, а не /data/db.
      # Если смонтировать /data/db, данные config-сервера уйдут в анонимный volume
      # и будут теряться при docker compose down.
      - config_data:/data/configdb

  # --- Shard 1 (replSet: shard1) ---
  shard1-1:
    container_name: shard1-1
    image: dh-mirror.gitverse.ru/mongo:latest
    command:
      - --shardsvr
      - --replSet
      - shard1
      - --bind_ip_all
      - --port
      - "27017"
    healthcheck:
      test: [ "CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - shard1_1_data:/data/db

  # --- Shard 2 (replSet: shard2) ---
  shard2-1:
    container_name: shard2-1
    image: dh-mirror.gitverse.ru/mongo:latest
    command:
      - --shardsvr
      - --replSet
      - shard2
      - --bind_ip_all
      - --port
      - "27017"
    healthcheck:
      test: [ "CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - shard2_1_data:/data/db

  # --- Router ---
  mongos_router:
    container_name: mongos_router
    image: dh-mirror.gitverse.ru/mongo:latest
    command:
      - mongos
      - --configdb
      - config_server/configSrv:27017
      - --bind_ip_all
      - --port
      - "27017"
    healthcheck:
      test: [ "CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    ports:
      - 27017:27017
    depends_on:
      configSrv:
        condition: service_healthy
      shard1-1:
        condition: service_healthy
      shard2-1:
        condition: service_healthy

  # --- Application ---
  pymongo_api:
    container_name: pymongo_api
    image: kazhem/pymongo_api:1.0.0
    # Без condition: service_healthy — mongos становится healthy только
    # после инициализации config-реплики, то есть после ./scripts/mongo-init.sh
    depends_on:
      - mongos_router
    ports:
      - 8080:8080
    environment:
      MONGODB_URL: "mongodb://mongos_router:27017"
      MONGODB_DATABASE_NAME: "somedb"

volumes:
  config_data:
  shard1_1_data:
  shard2_1_data:
